# =====================================================================
# 规则：自上而下匹配；净化(REJECT) 必须在 DIRECT/代理 之前
# =====================================================================
rules:
  # 1) 本地/内网：先直连，避免内网流量进代理、避免 DNS 泄漏
  - RULE-SET,private,🎯 全局直连
  - DOMAIN-SUFFIX,local,🎯 全局直连
  - IP-CIDR,127.0.0.0/8,🎯 全局直连,no-resolve
  - IP-CIDR,10.0.0.0/8,🎯 全局直连,no-resolve
  - IP-CIDR,172.16.0.0/12,🎯 全局直连,no-resolve
  - IP-CIDR,192.168.0.0/16,🎯 全局直连,no-resolve
  - IP-CIDR,100.64.0.0/10,🎯 全局直连,no-resolve
  - RULE-SET,private-ip,🎯 全局直连,no-resolve

  # 2) 净化：广告/统计/劫持域名直接拦掉（不占代理带宽、不污染 DNS）
  - RULE-SET,ads,🛑 广告拦截
  - RULE-SET,hijack,🛑 广告拦截
  - DOMAIN-KEYWORD,adservice,🛑 广告拦截

  # 3) 服务分流（顺序：专用 > 通用）
  - RULE-SET,ai,🤖 AI服务
  - RULE-SET,telegram,✈️ 电报消息
  - RULE-SET,telegram-ip,✈️ 电报消息,no-resolve
  - RULE-SET,youtube,📹 油管视频
  - RULE-SET,netflix,🎬 奈飞视频
  - RULE-SET,spotify,🎵 Spotify
  - RULE-SET,github,🐙 Github
  - RULE-SET,google,📢 谷歌服务
  - RULE-SET,apple,🍎 苹果服务
  - RULE-SET,microsoft,🪟 微软服务
  - RULE-SET,game,🎮 游戏平台
  - RULE-SET,bilibili,🎯 全局直连

  # 4) 国内直连（域名集 + IP 段）
  - RULE-SET,cn,🎯 全局直连
  - RULE-SET,cn-ip,🎯 全局直连,no-resolve
  - GEOIP,CN,🎯 全局直连,no-resolve

  # 5) 已知被墙域名
  - RULE-SET,gfw,🚀 节点选择

  # 6) 其余全走代理
  - MATCH,🐟 漏网之鱼
