# =====================================================================
# mihomo 多订阅聚合配置（净化 + 分流 + 按订阅分组）
# 本文件是模板：由 gen.py 结合 subs.yaml 渲染为 config.yaml 后导入客户端
# 可手改的部分：DNS / 规则 / 分组选项。订阅增减只改 subs.yaml
# =====================================================================

mixed-port: 7890
allow-lan: false
mode: rule
log-level: warning
ipv6: false

# 延迟显示更接近真实（去掉握手/首包差异）、并发建连、进程匹配
unified-delay: true
tcp-concurrent: true
find-process-mode: strict

# 记住手动选中的节点/分组，订阅刷新后不丢
profile:
  store-selected: true
  store-fake-ip: true

# GEOIP 数据自更新（客户端自带的 mmdb/dat 通常很旧）
geo-auto-update: true
geodata-loader: memconservative

# ---------------------------------------------------------------------
# TUN：三个客户端都用自己的 GUI 开关覆盖这里，保持 enable: false 即可
# ---------------------------------------------------------------------
tun:
  enable: false
  stack: mixed
  dns-hijack:
    - any:53
    - tcp://any:53
  auto-route: true
  auto-detect-interface: true

# ---------------------------------------------------------------------
# DNS 净化：fake-ip + 国内外分离解析 + respect-rules（DoH 走代理，防污染）
# ---------------------------------------------------------------------
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  cache-algorithm: arc
  prefer-h3: false
  use-hosts: true
  use-system-hosts: false

  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    # 局域网 / 设备发现 / 系统联网检测（下发真实 IP，否则会掉线或弹无网络）
    - '*.lan'
    - '*.local'
    - '+.msftconnecttest.com'
    - '+.msftncsi.com'
    - 'dns.msftncsi.com'
    - 'localhost.ptlogin2.qq.com'
    - 'localhost.sec.qq.com'
    - 'localhost.work.weixin.qq.com'
    # 游戏主机 / 语音通话 / STUN / NTP
    - '+.srv.nintendo.net'
    - '+.stun.playstation.net'
    - 'xbox.*.microsoft.com'
    - '+.battlenet.com.cn'
    - '+.wotgame.cn'
    - 'stun.*.*'
    - 'time.*.com'
    - 'ntp.*.com'
    - '+.pool.ntp.org'

  # DNS 查询本身遵守 rules（配合 proxy-server-nameserver，防 DNS 泄漏/污染）
  respect-rules: true

  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 1.1.1.1

  # 解析"代理节点域名"用的 DNS，必须是 IP 直连的服务器，否则会循环
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query
    - tls://8.8.4.4

  nameserver:
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query

  # DIRECT 出站的域名用国内 DNS 解析
  direct-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  # 按规则集分域名选择解析器：国内域名走国内 DoH，被墙域名直接走国外 DoH
  nameserver-policy:
    'rule-set:cn': &domestic
      - https://223.5.5.5/dns-query
      - https://1.12.12.12/dns-query
    'rule-set:private': *domestic
    'rule-set:gfw': &foreign
      - https://1.1.1.1/dns-query
      - https://8.8.8.8/dns-query
    'rule-set:ai': *foreign
    'rule-set:google': *foreign
    'rule-set:youtube': *foreign
    'rule-set:telegram': *foreign

# ---------------------------------------------------------------------
# 域名嗅探：TLS/QUIC 里还原真实域名，解决 fake-ip + 裸 IP 连接的误判
# ---------------------------------------------------------------------
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - 'Mijia Cloud'
    - '+.push.apple.com'

# =====================================================================
# 订阅：由 gen.py 按 subs.yaml 生成（不要在渲染产物里手改，改 subs.yaml）
# =====================================================================
proxy-providers:
# {{PROVIDERS}}

# =====================================================================
# 分组：节点选择 → 自动/手动 → 每订阅 → 地区 → 服务 → 兜底（顺序即 UI 顺序）
# =====================================================================
proxy-groups:
  # ---------------- 节点选择（总入口） ----------------
  - name: 🚀 节点选择
    type: select
    proxies:
      - ♻️ 自动选择
      - 🖱️ 手动选择
      - 🇭🇰 香港节点
      - 🇹🇼 台湾节点
      - 🇯🇵 日本节点
      - 🇸🇬 新加坡节点
      - 🇰🇷 韩国节点
      - 🇺🇸 美国节点
      - 🌍 其他地区
      - 🎯 全局直连
# {{SUB_GROUP_REFS}}
      - DIRECT

  # ---------------- 自动选择（全部订阅里自动测速） ----------------
  - name: ♻️ 自动选择
    type: url-test
    include-all-providers: true
    url: &test_url https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    timeout: 3000
    max-failed-times: 3
    lazy: true
    hidden: false

  # ---------------- 手动选择（所有订阅的全部节点，手动挑一个） ----------------
  - name: 🖱️ 手动选择
    type: select
    include-all-providers: true
    hidden: false

  # ---------------- 订阅选择（每订阅一组：自动 / 手动；gen.py 生成，请勿手改） ----------------
# {{SUB_GROUPS}}

  # ---------------- 地址选择（跨订阅自动汇总，新增订阅无需改这里） ----------------
  - name: 🇭🇰 香港节点
    type: url-test
    include-all-providers: true
    filter: "(?i)香港|港|hk|hong ?kong"
    url: *test_url
    interval: 300
    tolerance: 50
    lazy: true

  - name: 🇹🇼 台湾节点
    type: url-test
    include-all-providers: true
    filter: "(?i)台湾|台|tw|taiwan|台北"
    url: *test_url
    interval: 300
    tolerance: 50
    lazy: true

  - name: 🇯🇵 日本节点
    type: url-test
    include-all-providers: true
    filter: "(?i)日本|jp|japan|东京|大阪|川日"
    url: *test_url
    interval: 300
    tolerance: 50
    lazy: true

  - name: 🇸🇬 新加坡节点
    type: url-test
    include-all-providers: true
    filter: "(?i)新加坡|狮城|sg|singapore"
    url: *test_url
    interval: 300
    tolerance: 50
    lazy: true

  - name: 🇰🇷 韩国节点
    type: url-test
    include-all-providers: true
    filter: "(?i)韩国|韩|kr|korea|首尔"
    url: *test_url
    interval: 300
    tolerance: 50
    lazy: true

  - name: 🇺🇸 美国节点
    type: url-test
    include-all-providers: true
    filter: "(?i)美国|美|us|usa|united ?states|america|洛杉矶|圣何塞|西雅图"
    url: *test_url
    interval: 300
    tolerance: 50
    lazy: true

  - name: 🌍 其他地区
    type: select
    include-all-providers: true
    exclude-filter: "(?i)香港|港|hk|hong ?kong|台湾|台|tw|taiwan|台北|日本|jp|japan|东京|大阪|川日|新加坡|狮城|sg|singapore|韩国|韩|kr|korea|首尔|美国|美|us|usa|united ?states|america|洛杉矶|圣何塞|西雅图"

  # ---------------- 服务分流 ----------------
  - &svc_ai
    name: 🤖 AI服务
    type: select
    proxies: &svc_common
      - 🚀 节点选择
      - ♻️ 自动选择
      - 🇺🇸 美国节点
      - 🇯🇵 日本节点
      - 🇸🇬 新加坡节点
      - 🇭🇰 香港节点
      - DIRECT

  - name: ✈️ 电报消息
    type: select
    proxies: *svc_common

  - name: 📹 油管视频
    type: select
    proxies: *svc_common

  - name: 🎬 奈飞视频
    type: select
    proxies: *svc_common

  - name: 🎵 Spotify
    type: select
    proxies: *svc_common

  - name: 📢 谷歌服务
    type: select
    proxies: *svc_common

  - name: 🍎 苹果服务
    type: select
    proxies:
      - 🎯 全局直连
      - 🚀 节点选择

  - name: 🪟 微软服务
    type: select
    proxies:
      - 🎯 全局直连
      - 🚀 节点选择

  - name: 🐙 Github
    type: select
    proxies: *svc_common

  - name: 🎮 游戏平台
    type: select
    proxies: *svc_common

  - name: 🛑 广告拦截
    type: select
    proxies:
      - REJECT
      - DIRECT

  # ---------------- 兜底（放在最后，规则 MATCH 指向漏网之鱼） ----------------
  - name: 🐟 漏网之鱼
    type: select
    proxies:
      - 🚀 节点选择
      - ♻️ 自动选择
      - 🖱️ 手动选择
      - DIRECT

  - name: 🎯 全局直连
    type: select
    proxies:
      - DIRECT

# =====================================================================
